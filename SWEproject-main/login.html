<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مِراس - تسجيل الدخول</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="student.css">
</head>
<body data-role="student" data-page="auth">

  <header class="header">
    <a href="login.html" class="logo"><img src="logoMeras.png" alt="شعار مِراس"></a>
  </header>

  <main class="auth">
    <div class="auth-card">
      <div class="auth-head">
        <img src="sunMeras.png" alt="">
        <h1>تسجيــل الدخــول</h1>
        <p>أهلًا بعودتك إلى مِــراس.</p>
      </div>

      <p class="auth-msg" id="formMsg" hidden></p>

      <form id="loginForm" novalidate>
        <div class="auth-field"><label for="uid">الرقم الجامعي</label><input class="ltr" type="text" id="uid" name="uid" inputmode="numeric" maxlength="9" autocomplete="username"></div>
        <div class="auth-field">
          <label for="password">كلمة المرور</label>
          <div class="pass-wrap"><input class="ltr" type="password" id="password" name="password" autocomplete="current-password"><button type="button" class="pass-toggle">إظهــار</button></div>
        </div>
        <button type="button" class="auth-link" id="showForgot">نسيت كلمة المرور؟</button>
        <button type="submit" class="auth-btn">دخــول</button>
      </form>

      <form id="forgotForm" novalidate hidden>
        <div id="forgotStep1">
          <p class="auth-hint">أدخل البريد الإلكتروني المسجّل في حسابك.</p>
          <div class="auth-field"><label for="femail">البريد الإلكتروني</label><input class="ltr" type="email" id="femail" name="femail" placeholder="name@example.com" autocomplete="email"></div>
          <button type="submit" class="auth-btn">متابعــة</button>
        </div>
        <div id="forgotStep2" hidden>
          <p class="auth-hint">أنشئ كلمة مرور جديدة.</p>
          <div class="auth-field"><label for="newPassword">كلمة المرور الجديدة</label><div class="pass-wrap"><input class="ltr" type="password" id="newPassword" name="newPassword" autocomplete="new-password"><button type="button" class="pass-toggle">إظهــار</button></div></div>
          <div class="auth-field"><label for="newConfirm">تأكيد كلمة المرور</label><div class="pass-wrap"><input class="ltr" type="password" id="newConfirm" name="newConfirm" autocomplete="new-password"><button type="button" class="pass-toggle">إظهــار</button></div></div>
          <button type="submit" class="auth-btn">تغييــر كلمــة المــرور</button>
        </div>
        <button type="button" class="auth-link" id="backToLogin" style="margin:14px 0 0">العــودة إلى تسجيل الدخول</button>
      </form>

      <p class="auth-alt">ليس لديك حساب؟ <a href="register.html">إنشــاء حســاب جديــد</a></p>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="layout.js" defer></script>
  <script src="auth.js" defer></script>
</body>
</html>
