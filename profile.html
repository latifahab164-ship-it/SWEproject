<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مِراس - الملف الشخصي</title>

  <!-- التنسيق المشترك -->
  <link rel="stylesheet" href="Style.css">

  <!-- تنسيق صفحة الملف الشخصي فقط -->
  <style>

    /* =========================
       PROFILE PAGE
    ========================= */

    .profile-page {
      position: relative;
      padding: 55px 24px 75px;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 8% 18%,
          rgba(123, 176, 188, 0.24),
          transparent 25%
        ),
        radial-gradient(
          circle at 92% 85%,
          rgba(237, 208, 138, 0.30),
          transparent 24%
        ),
        var(--beige);
    }

    .profile-container {
      position: relative;
      z-index: 1;
      width: min(950px, 100%);
      margin: 0 auto;
    }


    /* =========================
       PAGE TITLE
    ========================= */

    .page-heading {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 28px;
    }

    .heading-sun {
      width: 58px;
      height: 58px;
      object-fit: contain;
    }

    .heading-text h1 {
      margin: 0 0 5px;
      color: var(--ink-dark);
      font-size: 34px;
      font-weight: 500;
    }

    .heading-text p {
      margin: 0;
      color: var(--ink);
      font-size: 16px;
      font-weight: 300;
    }


    /* =========================
       PROFILE CARD
    ========================= */

    .profile-card {
      background-color: var(--header-bg);
      border: 1px solid var(--gold);
      border-radius: 22px;
      padding: 34px;

      box-shadow:
        0 12px 32px rgba(31, 63, 73, 0.12);
    }


    /* =========================
       PROFILE HEADER
    ========================= */

    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .profile-avatar {
      width: 82px;
      height: 82px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background-color: var(--yellow);
      border: 3px solid var(--gold);

      color: var(--ink-dark);
      font-size: 30px;
      font-weight: 500;
    }

    .profile-intro h2 {
      margin: 0 0 5px;

      color: var(--ink-dark);
      font-size: 25px;
      font-weight: 500;
    }

    .profile-intro p {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 300;
    }


    /* =========================
       DIVIDER
    ========================= */

    .profile-divider {
      height: 1px;
      margin: 28px 0;
      background-color: var(--gold);
      opacity: 0.7;
    }


    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
      margin: 0 0 17px;
      color: var(--ink-dark);
      font-size: 20px;
      font-weight: 500;
    }


    /* =========================
       STUDENT INFORMATION
    ========================= */

    .profile-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .info-item {
      position: relative;

      display: flex;
      flex-direction: column;
      gap: 7px;

      padding: 18px 20px;

      background-color: var(--beige);

      border: 1px solid rgba(123, 176, 188, 0.45);
      border-right: 4px solid var(--teal);

      border-radius: 13px;
    }

    .info-label {
      color: var(--ink);
      font-size: 14px;
      font-weight: 300;
    }

    .info-value {
      color: var(--ink-dark);
      font-size: 17px;
      font-weight: 500;
    }


    /* =========================
       BUTTONS
    ========================= */

    .profile-actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      padding-top: 25px;

      border-top: 1px solid var(--yellow);
    }

    .profile-actions button {
      min-width: 170px;

      padding: 12px 24px;

      font-family: inherit;
      font-size: 15px;
      font-weight: 500;

      border-radius: 12px;

      cursor: pointer;

      transition:
        background-color 0.2s,
        color 0.2s,
        border-color 0.2s,
        transform 0.2s;
    }

    .profile-actions button:hover {
      transform: translateY(-2px);
    }

    .primary-btn {
      border: 2px solid var(--ink-dark);

      background-color: var(--ink-dark);
      color: var(--header-bg);
    }

    .primary-btn:hover {
      background-color: var(--teal);
      border-color: var(--teal);
      color: var(--ink-dark);
    }

    .secondary-btn {
      border: 2px solid var(--teal);

      background-color: transparent;
      color: var(--ink-dark);
    }

    .secondary-btn:hover {
      background-color: var(--yellow);
      border-color: var(--gold);
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 650px) {

      .profile-page {
        padding: 35px 16px 50px;
      }

      .heading-sun {
        width: 48px;
        height: 48px;
      }

      .heading-text h1 {
        font-size: 27px;
      }

      .heading-text p {
        font-size: 14px;
      }

      .profile-card {
        padding: 24px 18px;
      }

      .profile-avatar {
        width: 68px;
        height: 68px;
        font-size: 25px;
      }

      .profile-intro h2 {
        font-size: 21px;
      }

      .profile-info {
        grid-template-columns: 1fr;
      }

      .profile-actions {
        flex-direction: column;
      }

      .profile-actions button {
        width: 100%;
      }
    }

  </style>
</head>


<body data-role="student" data-page="profile">

  <!-- الهيدر المشترك -->
  <header class="header" id="site-header"></header>


  <main class="profile-page">

    <div class="profile-container">


      <!-- عنوان الصفحة -->
      <div class="page-heading">

        <img
          src="sunMeras.png"
          alt=""
          class="heading-sun"
        >

        <div class="heading-text">
          <h1>الملف الشخصي</h1>
          <p>معلومات حسابك الشخصي في مِراس</p>
        </div>

      </div>


      <!-- بطاقة الملف الشخصي -->
      <section class="profile-card">


        <!-- معلومات الطالب الأساسية -->
        <div class="profile-header">

          <div class="profile-avatar">
            <span>ط</span>
          </div>

          <div class="profile-intro">
            <h2>سارة محمد</h2>
            <p>طالبة في جامعة الملك سعود</p>
          </div>

        </div>


        <div class="profile-divider"></div>


        <!-- المعلومات الشخصية -->
        <h3 class="section-title">
          المعلومات الشخصية
        </h3>


        <div class="profile-info">

          <div class="info-item">
            <span class="info-label">
              الاسم الكامل
            </span>

            <span class="info-value">
              سارة محمد
            </span>
          </div>


          <div class="info-item">
            <span class="info-label">
              الرقم الجامعي
            </span>

            <span class="info-value">
              44XXXXXXX
            </span>
          </div>


          <div class="info-item">
            <span class="info-label">
              التخصص
            </span>

            <span class="info-value">
              تقنية المعلومات
            </span>
          </div>


          <div class="info-item">
            <span class="info-label">
              رقم الجوال
            </span>

            <span class="info-value" dir="ltr">
              05XXXXXXXX
            </span>
          </div>

        </div>


        <!-- الأزرار -->
        <div class="profile-actions">

          <button
            type="button"
            class="primary-btn"
          >
            تعديل المعلومات
          </button>


          <button
            type="button"
            class="secondary-btn"
          >
            تغيير كلمة المرور
          </button>

        </div>


      </section>

    </div>

  </main>


  <!-- الفوتر المشترك -->
  <footer
    class="footer"
    id="site-footer"
  ></footer>


  <script src="layout.js" defer></script>

</body>
</html>
